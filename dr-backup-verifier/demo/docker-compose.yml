# Демо-источник: «боевая» БД с тестовыми данными
services:
  source:
    image: postgres:16-alpine
    container_name: dr_demo_source
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: shop
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d shop"]
      interval: 2s
      retries: 30
